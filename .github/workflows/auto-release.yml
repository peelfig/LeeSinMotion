name: Auto Release Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Version
        id: get_version
        run: |
          VERSION=$(jq -r .version version.json)
          echo "Detected version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Extension Package
        run: |
          # Create strict folder structure
          mkdir -p release_build/com.peel.leesin.motion
          
          # Copy core extension files
          cp -r CSXS client host package.json release_build/com.peel.leesin.motion/
          
          # Copy installation guide to root of zip (not inside extension folder)
          cp "dist/安装说明_Installation.txt" release_build/
          
          # Zip it up
          cd release_build
          zip -r "LeeSinMotion_v${{ env.VERSION }}.zip" .
          
          # Move back to root for upload
          mv "LeeSinMotion_v${{ env.VERSION }}.zip" ../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: LeeSinMotion v${{ env.VERSION }}
          body: |
            ## 🚀 Auto-generated Release v${{ env.VERSION }}
            
            This release was automatically built and packaged by GitHub Actions.
            
            ### Installation / 安装
            1. Unzip the file.
            2. Move the `com.peel.leesin.motion` folder to your extensions directory.
            3. See `安装说明_Installation.txt` for details.
          files: |
            LeeSinMotion_v${{ env.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
