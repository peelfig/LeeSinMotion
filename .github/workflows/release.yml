name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'version.json'
      - 'dist/LeeSinMotion.jsx'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          VERSION=$(jq -r .version version.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Zip Package
        run: |
          cd dist
          zip -r "LeeSinMotion_v${{ env.VERSION }}_Release.zip" LeeSinMotion.jsx "安装方法.txt"
          mv "LeeSinMotion_v${{ env.VERSION }}_Release.zip" ..

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: LeeSinMotion v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/LeeSinMotion.jsx
            LeeSinMotion_v${{ env.VERSION }}_Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
