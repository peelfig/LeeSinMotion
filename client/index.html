<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeeSinMotion</title>
    <style>
        :root {
            --bg: #161616;
            --panel: #1f1f1f;
            --border: #333;
            --text: #eee;
            --text-dim: #888;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            user-select: none;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: #ccc;
            padding: 8px 0;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #2a2a2a;
            color: #fff;
            border-color: #555;
        }

        .btn:active {
            background: #111;
        }

        /* Output Area - Increased height since tabs are gone */
        textarea {
            flex: 1;
            background: #0b0b0b;
            border: 1px solid var(--border);
            color: #ddd;
            font-family: "Menlo", monospace;
            font-size: 11px;
            padding: 8px;
            resize: none;
            outline: none;
            border-radius: 3px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            align-items: center;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: #ccc;
            cursor: pointer;
            border-radius: 3px;
        }

        .version {
            font-size: 11px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="btn-group">
        <button class="btn" id="btn-extract">提取：选中片段</button>
        <button class="btn" id="btn-single">提取：单帧时间</button>
        <button class="btn" id="btn-layer">扫描：当前图层</button>
        <button class="btn" id="btn-comp">扫描：当前预合成</button>
    </div>

    <!-- Removed Tabs -->

    <textarea id="output" readonly>请打开一个合成</textarea>

    <div class="footer">
        <div style="display:flex; gap:8px;">
            <button class="btn-sm">新计数器</button>
            <button class="btn-sm">✱</button>
            <button class="btn-sm">最新版本</button>
        </div>
        <div class="version">v3.5.4 CEP</div>
    </div>

    <script src="CSInterface.js"></script>
    <script>
        const cs = new CSInterface();

        document.getElementById('btn-extract').onclick = () => run('getKeysSpec()');
        document.getElementById('btn-single').onclick = () => run('getSingleKeySpec()');
        document.getElementById('btn-layer').onclick = () => run('getLayerSpec()');
        document.getElementById('btn-comp').onclick = () => run('getCompSpec()');

        function run(script) {
            document.getElementById('output').value = "计算中...";
            cs.evalScript(script, (res) => {
                document.getElementById('output').value = res;
            });
        }
    </script>
</body>

</html>
