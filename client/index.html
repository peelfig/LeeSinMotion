<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeeSinMotion</title>
    <style>
        :root {
            --bg: #161616;
            --panel: #1f1f1f;
            --border: #333;
            --text: #eee;
            --text-dim: #888;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            user-select: none;
            cursor: default;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid var(--border);
            color: #ccc;
            padding: 8px 0;
            font-size: 12px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #2a2a2a;
            color: #fff;
            border-color: #555;
        }

        .btn:active {
            background: #111;
        }

        /* Output Area */
        textarea {
            flex: 1;
            background: #0b0b0b;
            border: 1px solid var(--border);
            color: #ddd;
            font-family: "Menlo", monospace;
            font-size: 11px;
            padding: 8px;
            resize: none;
            outline: none;
            border-radius: 3px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            align-items: center;
        }

        /* Footer Buttons */
        .footer-btn {
            font-size: 11px;
            color: #666;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            outline: none;
            transition: color 0.2s;
        }

        .footer-btn:hover {
            color: #999;
        }

        #btn-web {
            color: #888;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #btn-web:hover {
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="btn-group">
        <button class="btn" id="btn-extract">提取：选中片段</button>
        <button class="btn" id="btn-single">提取：单帧时间</button>
        <button class="btn" id="btn-layer">扫描：当前图层</button>
        <button class="btn" id="btn-comp">扫描：当前预合成</button>
    </div>

    <textarea id="output" readonly>请打开一个合成</textarea>

    <div class="footer">
        <button id="btn-web" class="footer-btn">访问官网</button>
        <button id="btn-version" class="footer-btn">v3.5.4 CEP</button>
    </div>

    <script src="CSInterface.js"></script>
    <script>
        const cs = new CSInterface();

        function openURL(url) {
            if (window.cep && window.cep.util) {
                window.cep.util.openURLInDefaultBrowser(url);
            } else if (cs.openURLInDefaultBrowser) {
                cs.openURLInDefaultBrowser(url);
            } else {
                try {
                    const cmd = (navigator.platform.indexOf('Mac') >= 0) ? `open "${url}"` : `start "" "${url}"`;
                    window.cep.process.createProcess('/bin/sh', '-c', cmd);
                } catch (e) {
                    document.getElementById('output').value = "无法打开链接: " + url;
                }
            }
        }

        document.getElementById('btn-extract').onclick = () => run('getKeysSpec()');
        document.getElementById('btn-single').onclick = () => run('getSingleKeySpec()');
        document.getElementById('btn-layer').onclick = () => run('getLayerSpec()');
        document.getElementById('btn-comp').onclick = () => run('getCompSpec()');

        document.getElementById('btn-web').onclick = () => {
            openURL("https://leesin.peelg.com/");
        };

        function run(script) {
            document.getElementById('output').value = "计算中...";
            cs.evalScript(script, (res) => {
                document.getElementById('output').value = res;
            });
        }

        const currentVer = "3.5.4";
        fetch("https://raw.githubusercontent.com/peelfig/LeeSinMotion/main/version.json")
            .then(res => res.json())
            .then(data => {
                if (data.version && data.version > currentVer) {
                    const b = document.getElementById('btn-version');
                    b.innerText = "升级 v" + data.version;
                    b.style.color = "#ffaa00";
                    b.style.fontWeight = "bold";
                    b.onclick = () => openURL("https://github.com/peelfig/LeeSinMotion/releases/latest");
                }
            }).catch(e => { });
    </script>
</body>

</html>
